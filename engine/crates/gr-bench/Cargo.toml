[package]
name = "gr-bench"
description = "Reproducible benchmarks of the Guanacaste Render engine against the C# baseline."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gr-core = { path = "../gr-core" }
gr-gpu = { path = "../gr-gpu" }
gr-model = { path = "../gr-model" }
png.workspace = true
glam.workspace = true
rayon.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "gr-bench"
path = "src/main.rs"

[[bin]]
name = "gpu"
path = "src/gpu.rs"

[[bin]]
name = "mesh"
path = "src/mesh.rs"

[[bin]]
name = "denoise"
path = "src/denoise.rs"

[[bin]]
name = "raster"
path = "src/raster.rs"
