[package]
name = "gr-model"
description = "Guanacaste project files and the building mesher: from a .gr project to triangles, without the C# application."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gr-core = { path = "../gr-core" }
glam.workspace = true
serde.workspace = true
# Key order is kept when a project is edited and written back.
serde_json = { workspace = true, features = ["preserve_order"] }
flate2.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_code = "forbid"
