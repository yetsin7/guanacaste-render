[workspace]
resolver = "2"
members = ["crates/gr-core", "crates/gr-model", "crates/gr-gpu", "crates/gr-studio", "crates/gr-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
rayon = "1.10"
wide = "0.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "30"
pollster = "0.4"
png = "0.18"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
