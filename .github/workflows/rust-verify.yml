name: Rust engine verification

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/rust-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/rust-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test and build (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build studio
        run: cargo build --release --locked -p gr-studio --bin GuanacasteStudio
